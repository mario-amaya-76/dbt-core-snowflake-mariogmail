version: 2

models:
  - name: mart_erp_bipac__bipac
    description: >
      Consolidated BIPAC table combining records from the BIDBFA050, BIDBFE902,
      and BIDBFW753 schemas into a single unified table.
    columns:
      - name: bipac_id
        description: Surrogate key derived from source_schema + _fivetran_id.
        tests:
          - not_null
          - unique
      - name: source_schema
        description: The originating schema for this row — one of BIDBFA050, BIDBFE902, BIDBFW753.
        tests:
          - not_null

